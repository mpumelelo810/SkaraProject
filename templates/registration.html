{% load static %}
{% include 'header.html' %}
<div class="clear"></div>
<div id="page-content">
    <section class="breadcrumb">
        <div class="container">

            <ul>
                <li><a href="{% url 'index' %}">Home</a> ></li>
                <li><a href="{% url 'register' %}">Registration form</a> ></li>

            </ul>
        </div>
    </section>

    <section class="dashboard">
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="dashboard-content">
                        <h2>Register</h2>
                        <form method="post" action="{% url 'register' %}">
                            {% csrf_token %}
                            {{ msg }}

                            <div class="form-group">
                                <label for="firstname">First Name:</label>
                                <input type="text" name="firstname" id="firstname" class="form-control" placeholder="First Name">
                            </div>

                            <div class="form-group">
                                <label for="lastname">Last Name:</label>
                                <input type="text" name="lastname" id="lastname" class="form-control" placeholder="Last Name">
                            </div>

                            <div class="form-group">
                                <label for="phone">Phone Number:</label>
                                <input type="text" name="phone" id="phone" class="form-control" placeholder="Phone Number">
                            </div>

                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="text" name="email" id="email" class="form-control" placeholder="Email">
                            </div>

                            <div class="form-group">
                                <label for="password">Password:</label>
                                <input type="password" name="password" id="password" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="gender">Gender:</label>
                                <select name="gender" id="gender" class="form-control">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="address">Address:</label>
                                <textarea name="address" id="address" class="form-control" placeholder="Address"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="dob">Date of Birth:</label>
                                <input type="date" name="dob" id="dob" class="form-control">
                            </div>

                            <div class="form-group">
                                <label for="transactionalcoefficient">Transactional Coefficient:</label>
                                <input type="text" name="transactionalcoefficient" id="transactionalcoefficient" class="form-control" placeholder="Transactional Coefficient">
                            </div>

                            <button type="submit" class="btn btn-primary">Register</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    {% include 'footer.html' %}
</div>
</html>
