{% load static %}
{% include 'header.html' %}
    <div class="clear"></div>
    <div id="page-content">
        <section class="breadcrumb">
            <div class="container">
                <!-- The breadcrumb section is used to show the user's current location on the website -->
                <ul>
                    <li><a href="index.html">Home</a> ></li>
                </ul>
            </div>
        </section>
        <section class="blog-page">
            <div class="container">
                <div class="row">
                    <div class="col-sm-8">
                        <div class="single-post">
                            <!-- The content of the blog post is displayed here -->
                        </div>
                        <div class="social-post">
                            <!-- The social-post section contains links to share the blog post on social media -->
                            <div class="social-text">
                                <ul class="ml-auto social-icon">
                                    <li>
                                        <a href="#"><i class="fa fa-facebook"></i></a>
                                    </li>
                                    <li>
                                        <a href="#"><i class="fa fa-twitter"></i></a>
                                    </li>
                                    <li>
                                        <a href="#"><i class="fa fa-google-plus"></i></a>
                                    </li>
                                    <li>
                                        <a href="#"><i class="fa fa-youtube"></i></a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <!-- The comment section allows users to leave comments on the blog post -->
                        <h2>Leave A Comment</h2>
                        <div class="comment">
                            <div class="row">
                                <form method="POST" action="{% url 'contact' %}">
                                    {% csrf_token %}
                                    {{ form.as_p }}
                                    {{ msg }}
                                <div class="col-sm-8">
                                    
                                    <div>
                                        <input type="text" name="name" placeholder="Name" />
                                    </div>
                                    <div>
                                        <input type="text" name="email" placeholder="Email" />
                                    </div>
                                    <div>
                                        <input type="text" name="subject" placeholder="Subject" />
                                    </div>
                                </div>
                                <div class="col-sm-10">
                                    <div>
                                        <textarea rows="1" cols="1" placeholder="Message"></textarea>
                                    </div>
                                    <div>
                                        <input type="submit" class="btn-default" value="Submit" />
                                    </div>
                                </div>
                            </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="blog-post">
                            <!-- The search section allows users to search for content on the website -->
                            <h2>Search</h2>
                            <div class="input-group search-text">
                                <input type="text" class="form-control search" placeholder="Search">
                                <span class="input-group-btn">
                                    <button class="btn btn-default btn-search" type="button"><i class="fa fa-search"></i></button>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="clear"></div>
    {% include 'footer.html' %}
