{% include 'header.html' %}
<main class="container" style="padding-top:110px;padding-bottom:70px;max-width:640px">
  <h1>Log in</h1>
  {% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <div class="form-group"><label for="username">Phone number</label><input class="form-control" id="username" name="username" required autocomplete="username"></div>
    <div class="form-group"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
</main>
{% include 'footer.html' %}
